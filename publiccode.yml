description:
  it:
    shortDescription: >
      Piattaforma a supporto dell'intero ciclo aziendale di
      programmazione, controllo e valutazione della performance
      aziendale ed individuale.

    longDescription: |
      La Piattaforma di Programmazione e Controllo, interamente
      informatizzata e resa disponibile via web mediante accessi
      profilati, supporta l'intero processo aziendale di
      programmazione, controllo e valutazione.

      La piattaforma rappresenta uno strumento di comunicazione
      e gestione a disposizione della Direzione Strategica e
      del personale coinvolto nel processo di programmazione
      e controllo aziendale.

      In base al profilo utente (Direzione, Responsabile di CDR,
      Dirigente, Comparto, ecc.) vengono resi disponibili specifici
      moduli applicativi a supporto delle varie fasi operative.

      Le principali aree funzionali comprendono:

      - Programmazione
        - Strategia
        - Obiettivi
        - Progetti
        - Programmazione e controllo costi e ricavi
        - Investimenti

      - Controllo
        - Rendicontazione obiettivi
        - Report di contabilità analitica
        - Cruscotto indicatori

      - Valutazioni
        - Valutazione della performance individuale

    documentation: >
      https://cdgwiki.ats-milano.it/mediawiki/index.php?title=Manuale_Utente

    apiDocumentation: >
      https://cdgwiki.ats-milano.it/mediawiki/index.php?title=Man_Tecnico:Manuale_Tecnico

    features:
      - Gestione del ciclo di programmazione aziendale
      - Controllo e monitoraggio degli obiettivi
      - Gestione di costi, ricavi e investimenti
      - Rendicontazione e reporting
      - Valutazione della performance individuale
      - Cruscotti e indicatori direzionali

